name: CI

on:
  push:
  pull_request:

jobs:
  # Blocking: typecheck + unit tests (no database needed).
  build-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  # Integration tests against an ephemeral local Supabase (migrations applied
  # by `supabase start`). No live project is involved.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned: `latest` resolves via an unauthenticated GitHub API call, which
      # hits the shared runner rate limit ("Failed to resolve latest ... release").
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start local Supabase (applies migrations)
        run: supabase start

      - name: Integration tests
        run: |
          eval "$(supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:int

      - name: Stop local Supabase
        if: always()
        run: supabase stop
